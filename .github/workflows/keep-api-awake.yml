# Render's free plan puts the API to sleep after 15 idle minutes, and waking it takes up to a minute.
# A ping every 10 minutes keeps it awake for visitors; one always-on service fits the free 750 hours a month.
# Scheduled workflows run from the default branch only.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://airbnb-clone-api-529x.onrender.com/api/health
