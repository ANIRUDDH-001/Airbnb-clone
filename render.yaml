# Render Blueprint for the FastAPI backend (Dashboard → New → Blueprint → pick this repo).
# The frontend deploys separately on Vercel with its root directory set to `frontend/`.
services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    plan: free
    region: singapore # closest free region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt && sh scripts/install-litestream.sh
    startCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Signs the session cookie. Render generates a random value once and keeps it across deploys.
      - key: SESSION_SECRET
        generateValue: true
      # The cookie only ever travels over HTTPS (browser → Vercel → Render).
      - key: COOKIE_SECURE
        value: "true"
      # The free plan has no persistent disk, so Litestream keeps the SQLite file in a Backblaze B2
      # bucket (free tier) and restores it on every boot. The database is seeded only when neither
      # the disk nor the bucket has one yet. Fill these in on the Render dashboard.
      # Rollback: delete LITESTREAM_BUCKET and redeploy; the API then runs on a local, re-seeded file.
      # Use a bucket-restricted key (the master key doesn't work with B2's S3 API).
      - key: SEED_ON_STARTUP
        value: "true"
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT # e.g. https://s3.us-east-005.backblazeb2.com
        sync: false
      - key: LITESTREAM_REGION # e.g. us-east-005
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID # B2 application key ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY # B2 application key
        sync: false
